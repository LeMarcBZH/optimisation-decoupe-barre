<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1c2430;--mu:#66707d;--bd:#d5d9df;--ac:#c2410c;--ac2:#fff4ec;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2229;--tx:#e8ebef;--mu:#98a2ae;--bd:#333b45;--ac:#fb923c;--ac2:#2a2018;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2229;--tx:#e8ebef;--mu:#98a2ae;--bd:#333b45;--ac:#fb923c;--ac2:#2a2018;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1 1 140px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.x{color:#b91c1c}
.ico{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;color:var(--ac);background:var(--ac2)}
.ico svg{width:30px;height:30px}
.pcs{margin-top:12px}.pcs .r{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.pcs .r input{flex:1}
.bar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.fiche{margin-bottom:26px}
.fiche h3{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:17px}
.fiche h3 .ico{width:34px;height:34px;flex-basis:34px}.fiche h3 .ico svg{width:22px;height:22px}
.meta{color:var(--mu);font-size:13px;margin-bottom:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:middle}
th{background:var(--ac2);font-size:12px}tr.sep td{border-top:2px solid var(--tx)}
td.c{text-align:center}
td input.cm{border:0;background:transparent;padding:2px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
.empty{color:var(--mu);font-style:italic}
@media print{
@page{size:A4;margin:12mm}
:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#888;--ac:#000;--ac2:#eee}
body{font-size:11px}main{max-width:none;padding:0}
#setup,.noprint{display:none!important}
.fiche{break-inside:avoid;margin-bottom:16px}
input.cm{color:#000}
}
</style>

</svg></span><h1 style="margin:0">Optimisation découpe barre</h1></header>
<p class="sub noprint">Renseignez vos profils et les pièces à débiter : les fiches de débit se calculent automatiquement.</p>

<section id="setup">
<h2>1. Profils</h2>
<div id="profs"></div>
<button class="p" onclick="addProf()">+ Ajouter un profil</button>
</section>

<section style="margin-top:22px">
<div class="bar noprint"><h2>2. Fiches de débit</h2><button class="p" onclick="exportPdf()">Exporter en PDF (A4)</button></div>
<div id="st" class="noprint" style="display:none;margin-bottom:12px;padding:10px 12px;border:1px solid var(--ac);border-radius:8px;background:var(--ac2)"></div>
<div id="out"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
const S={rond:'<circle cx="12" cy="12" r="8"/>',
carre:'<rect x="5" y="5" width="14" height="14"/>',
plat:'<rect x="2" y="9" width="20" height="6"/>',
corniere:'<path d="M5 4v16h15v-4H9V4z"/>',
te:'<path d="M3 5h18v4h-7v11h-4V9H3z"/>',
demi:'<path d="M3 16a9 9 0 0 1 18 0z"/>',
tronde:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/>',
tcarre:'<rect x="3" y="3" width="18" height="18"/><rect x="7" y="7" width="10" height="10"/>',
trect:'<rect x="2" y="6" width="20" height="12"/><rect x="5.5" y="9.5" width="13" height="5"/>',
autre:'<path d="M9 9a3 3 0 1 1 4 2.8c-1 .5-1 1.2-1 2.2M12 18v.5"/><rect x="3" y="3" width="18" height="18" rx="3"/>'};
const N={rond:'Rond',carre:'Carré',plat:'Plat',corniere:'Cornière',te:'Té',demi:'Demi rond',tronde:'Tube rond',tcarre:'Tube carré',trect:'Tube rectangle',autre:'Autre'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${S[k]||S.autre}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let P=[],uid=1;
try{const d=JSON.parse(localStorage.getItem('decoupe')||'null');if(d){P=d.P;uid=d.uid}}catch(e){}
function save(){try{localStorage.setItem('decoupe',JSON.stringify({P,uid}))}catch(e){}}
function addProf(){P.push({id:uid++,name:'',shape:'rond',len:'6000',kerf:'3',qty:'',pcs:[{l:'',q:''}],n:{}});save();draw();calc()}
function delProf(i){P.splice(i,1);save();draw();calc()}
function addPc(i){P[i].pcs.push({l:'',q:''});save();draw()}
function delPc(i,j){P[i].pcs.splice(j,1);save();draw();calc()}
function draw(){
document.getElementById('profs').innerHTML=P.map((p,i)=>`<div class="card"><div class="row">
<div class="ico" id="ic${i}">${svg(p.shape)}</div>
<label style="flex:2 1 180px">Nom du profil<input value="${esc(p.name)}" placeholder="ex. Carré 20x20 ép. 2" oninput="P[${i}].name=this.value;save();calc()"></label>
<label>Forme<select onchange="P[${i}].shape=this.value;document.getElementById('ic${i}').innerHTML=svg(this.value);save();calc()">${Object.keys(N).map(k=>`<option value="${k}"${k==p.shape?' selected':''}>${N[k]}</option>`).join('')}</select></label>
<label>Longueur(s) des barres (mm)<input value="${esc(p.len)}" placeholder="6000 ou 6000,3000" oninput="P[${i}].len=this.value;save();calc()"></label>
<label style="flex:0 1 120px">Largeur de coupe (mm)<input type="number" step="0.1" min="0" value="${esc(p.kerf)}" oninput="P[${i}].kerf=this.value;save();calc()"></label>
<label style="flex:0 1 130px">Nb de barres dispo<input type="number" min="1" value="${esc(p.qty||'')}" placeholder="∞ illimité" oninput="P[${i}].qty=this.value;save();calc()"></label>
<button class="x" onclick="delProf(${i})" title="Supprimer">✕</button></div>
<div class="pcs"><div style="font-size:12px;color:var(--mu);margin-bottom:4px">Pièces à débiter (longueur mm × quantité)</div>
${p.pcs.map((c,j)=>`<div class="r"><input type="number" min="1" placeholder="Longueur" value="${esc(c.l)}" oninput="P[${i}].pcs[${j}].l=this.value;save();calc()"><span>×</span><input type="number" min="1" placeholder="Qté" value="${esc(c.q)}" oninput="P[${i}].pcs[${j}].q=this.value;save();calc()"><button class="x" onclick="delPc(${i},${j})">✕</button></div>`).join('')}
<button onclick="addPc(${i})">+ Pièce</button></div></div>`).join('');
}
function opt(p){
const L=p.len.split(/[,;\s]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b),k=parseFloat(p.kerf)||0;
const list=[];p.pcs.forEach(c=>{const l=+c.l,q=parseInt(c.q)||0;for(let n=0;n<q&&l>0;n++)list.push(l)});
list.sort((a,b)=>b-a);const bars=[],rej=[],miss=[],mx=parseInt(p.qty)>0?parseInt(p.qty):Infinity;
for(const l of list){
let b=bars.find(b=>b.s+l+k*(b.c.length+1)<=b.L||(b.c.length==0&&l<=b.L));
if(!b){const Lb=L.find(x=>x>=l);if(!Lb){rej.push(l);continue}if(bars.length>=mx){miss.push(l);continue}b={L:Lb,c:[],s:0};bars.push(b)}
b.c.push(l);b.s+=l}
bars.forEach(b=>b.ch=b.L-b.s-k*(b.c.length>1?b.c.length-1:0));
return{bars,rej,miss,k}}
function calc(){
const o=document.getElementById('out');
if(!P.length){o.innerHTML='<p class="empty">Ajoutez un profil pour commencer.</p>';return}
o.innerHTML=P.map((p,i)=>{
const r=opt(p),tot=r.bars.reduce((a,b)=>a+b.L,0),ch=r.bars.reduce((a,b)=>a+b.ch,0);
const rows=r.bars.map((b,j)=>{const g={};b.c.forEach(x=>g[x]=(g[x]||0)+1);
const e=Object.entries(g).sort((a,c)=>c[0]-a[0]),n=e.length,c0=Math.round(b.ch*10)/10;
return e.map(([l,q],k)=>{const key=j+'_'+k,m=p.n[key]||{};
return`<tr${k?'':' class="sep"'}>${k?'':`<td class="c" rowspan="${n}">${j+1}</td><td class="c" rowspan="${n}">${b.L}</td>`}<td class="c">${l}</td><td class="c">${q}</td>${k?'':`<td class="c" rowspan="${n}">${c0}</td>`}<td style="min-width:130px"><input class="cm" value="${esc(m.c||'')}" placeholder="…" oninput="nt(${i},'${key}','c',this.value)"></td><td class="c"><input type="checkbox" ${m.k?'checked':''} onchange="nt(${i},'${key}','k',this.checked)"></td></tr>`}).join('')}).join('');
return`<div class="fiche card"><h3><span class="ico">${svg(p.shape)}</span>${esc(p.name||'Profil sans nom')} <span style="font-weight:400;color:var(--mu);font-size:13px">(${N[p.shape]})</span></h3>
<div class="meta">Coupe : ${p.kerf||0} mm · ${r.bars.length} barre(s) utilisée(s) · Barres dispo : ${p.qty?esc(p.qty):'∞'} · Chutes : ${tot?Math.round(ch/tot*1000)/10:0} %</div>
${r.miss.length?`<div class="meta" style="color:#b91c1c">Stock de barres insuffisant : ${r.miss.length} pièce(s) non placée(s) (${[...new Set(r.miss)].join(', ')} mm)</div>`:''}${r.rej.length?`<div class="meta" style="color:#b91c1c">Pièce(s) plus longue(s) que les barres : ${[...new Set(r.rej)].join(', ')} mm</div>`:''}
${r.bars.length?`<div class="tw"><table><thead><tr><th>Barre</th><th>Barre d'origine (mm)</th><th>Longueur (mm)</th><th>Qté</th><th>Chute</th><th>Commentaire</th><th>✔</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="empty">Aucune pièce saisie.</p>'}</div>`}).join('')}

function pdfIcon(d,k,x,y){
const poly=p=>d.lines(p.slice(1).map((q,i)=>[q[0]-p[i][0],q[1]-p[i][1]]),p[0][0],p[0][1],[1,1],'S',true);
d.setDrawColor(0);d.setLineWidth(.35);
if(k=='rond')d.circle(x+4,y+4,3.6);
else if(k=='carre')d.rect(x+.5,y+.5,7,7);
else if(k=='plat')d.rect(x,y+2.5,8,3);
else if(k=='corniere')poly([[x+1,y],[x+1,y+7.5],[x+8,y+7.5],[x+8,y+5.5],[x+3,y+5.5],[x+3,y]]);
else if(k=='te')poly([[x,y+1],[x+8,y+1],[x+8,y+3],[x+5,y+3],[x+5,y+7.5],[x+3,y+7.5],[x+3,y+3],[x,y+3]]);
else if(k=='demi'){const p=[];for(let a=0;a<=180;a+=20)p.push([x+4+4*Math.cos(a*Math.PI/180),y+6-4*Math.sin(a*Math.PI/180)]);poly(p)}
else if(k=='tronde'){d.circle(x+4,y+4,3.8);d.circle(x+4,y+4,2.2)}
else if(k=='tcarre'){d.rect(x+.3,y+.3,7.4,7.4);d.rect(x+2.2,y+2.2,3.6,3.6)}
else if(k=='trect'){d.rect(x,y+1.5,8,5);d.rect(x+1.5,y+3,5,2)}
else{d.rect(x+.5,y+.5,7,7);d.setFontSize(9);d.text('?',x+4,y+6,{align:'center'})}}
function st(m){const e=document.getElementById('st');e.textContent=m;e.style.display=m?'block':'none'}
async function exportPdf(){
st('Préparation du PDF…');
if(!window.jspdf||!window.jspdf.jsPDF){st('Erreur : la bibliothèque PDF (jsPDF) n\'a pas pu se charger. Vérifiez votre connexion ou un bloqueur de contenu.');return}
let dl=null;try{if(typeof claude!=='undefined')dl=await claude.use('downloads')}catch(e){}
try{await exportPdf2(dl)}catch(e){st('Erreur : '+((e&&(e.message||e.code))||e))}}
async function exportPdf2(dl){
const d=new jspdf.jsPDF({unit:'mm',format:'a4'});
d.setFont('helvetica','bold');d.setFontSize(15);d.setTextColor(0);
d.text('Fiches de débit',12,16);
d.setFont('helvetica','normal');d.setFontSize(9);d.text(new Date().toLocaleDateString('fr-FR'),198,16,{align:'right'});
let y=26;
P.forEach(p=>{
const r=opt(p),tot=r.bars.reduce((a,b)=>a+b.L,0),ch=r.bars.reduce((a,b)=>a+b.ch,0);
if(y>235){d.addPage();y=14}
pdfIcon(d,p.shape,12,y-5);
d.setFont('helvetica','bold');d.setFontSize(12);d.text((p.name||'Profil sans nom')+'  ('+N[p.shape]+')',24,y);
d.setFont('helvetica','normal');d.setFontSize(9);
d.text('Coupe : '+(p.kerf||0)+' mm  -  '+r.bars.length+' barre(s)  -  Dispo : '+(p.qty||'illimité')+'  -  Chutes : '+(tot?Math.round(ch/tot*1000)/10:0)+' %',24,y+5);
const body=[],keys=[],C={halign:'center'};
r.bars.forEach((b,j)=>{const g={};b.c.forEach(x=>g[x]=(g[x]||0)+1);
const e=Object.entries(g).sort((a,c)=>c[0]-a[0]),n=e.length;
e.forEach(([l,q],k)=>{const key=j+'_'+k;keys.push(key);const row=[];
if(!k)row.push({content:String(j+1),rowSpan:n,styles:C},{content:String(b.L),rowSpan:n,styles:C});
row.push({content:String(l),styles:C},{content:String(q),styles:C});
if(!k)row.push({content:String(Math.round(b.ch*10)/10),rowSpan:n,styles:C});
row.push((p.n[key]||{}).c||'','');body.push(row)})});
d.autoTable({startY:y+8,margin:{left:12,right:12},head:[['Barre',"Barre d'origine (mm)",'Longueur (mm)','Qté','Chute','Commentaire','']],body,theme:'grid',
styles:{fontSize:9,cellPadding:1.8,textColor:0,lineColor:[120,120,120],lineWidth:.2,minCellHeight:8,valign:'middle'},
headStyles:{fillColor:[235,235,235],textColor:0,halign:'center'},
columnStyles:{0:{cellWidth:14},1:{cellWidth:26},2:{cellWidth:24},3:{cellWidth:14},4:{cellWidth:16},5:{cellWidth:'auto'},6:{cellWidth:12}},
didDrawCell:h=>{if(h.section=='body'&&h.column.index==6){const c=h.cell,z=4.5,cx=c.x+c.width/2,cy=c.y+c.height/2;d.setDrawColor(0);d.setLineWidth(.3);d.rect(cx-z/2,cy-z/2,z,z);
if((p.n[keys[h.row.index]]||{}).k){d.line(cx-1.5,cy,cx-.4,cy+1.4);d.line(cx-.4,cy+1.4,cx+1.6,cy-1.6)}}}});
y=d.lastAutoTable.finalY+12});
try{if(dl)await dl.save({filename:'fiche-de-debit.pdf',data:d.output('arraybuffer')});else d.save('fiche-de-debit.pdf');st('PDF enregistré.')}catch(e){st(e&&e.code=='declined'?'Enregistrement annulé.':'Erreur de téléchargement : '+((e&&(e.message||e.code))||e))}}
function nt(i,j,f,v){(P[i].n[j]=P[i].n[j]||{})[f]=v;save()}
if(!P.length)P.push({id:uid++,name:'Tube carré 30x30x2',shape:'tcarre',len:'6000',kerf:'3',pcs:[{l:'1450',q:'4'},{l:'820',q:'6'}],n:{}});
draw();calc();
</script>
</body>
</html>
